<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Iconos Apple -->
    <link rel="apple-touch-icon" href="imagenes/icons/icon-72x72.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-128x128.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-144x144.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-152x152.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-384x384.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-512x512.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Coffe PWA</title>

    <style>
        /* Estilos del detalle (integrados aquí) */
        .detalle-wrapper {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .fila-superior {
            display: flex;
            gap: 32px;
            align-items: center;
            margin-bottom: 36px;
            padding-bottom: 32px;
            border-bottom: 1px solid #f0f0f0;
        }

        .mitad-imagen {
            flex: 0 0 180px;
            width: 180px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .mitad-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mitad-descripcion { flex: 1; min-width: 0; }
        .mitad-descripcion h1 { margin: 0 0 6px 0; color: #1a1a1a; font-size: 1.65rem; }
        .detalle-precio { font-size: 1.4rem; color: #b06b2c; font-weight: 600; margin: 0 0 14px 0; }
        .detalle-desc { color: #666; font-size: 0.95rem; line-height: 1.6; margin: 0; }

        .seccion { margin-bottom: 28px; }
        .seccion-titulo {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin: 0 0 12px 0;
            color: #999;
        }
        .seccion-texto { color: #555; font-size: 0.92rem; line-height: 1.7; margin: 0; }

        .detalle-datos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .detalle-datos li {
            background: #fafafa;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detalle-datos li span:first-child {
            color: #999; font-size: 0.72rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.8px;
        }
        .detalle-datos li span:last-child { color: #1a1a1a; font-size: 0.95rem; font-weight: 500; }

        .lista-ingredientes {
            list-style: none; padding: 0; margin: 0;
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .lista-ingredientes li {
            padding: 8px 14px; background: #fafafa; border: 1px solid #eee;
            border-radius: 20px; color: #555; font-size: 0.85rem;
        }

        .btn-volver {
            display: inline-block; padding: 12px 24px; background: #1a1a1a;
            color: #fff; text-decoration: none; border-radius: 10px;
            font-size: 0.9rem; font-weight: 500; transition: background 0.2s ease;
            margin-top: 8px; cursor: pointer; border: none;
        }
        .btn-volver:hover { background: #b06b2c; }

        /* Ocultar la vista de detalle por defecto */
        #vista-detalle { display: none; }
        #vista-detalle.activa { display: block; }
        #vista-catalogo.oculta { display: none; }

        /* Encabezado pequeño de la vista detalle */
        .detalle-header {
            max-width: 820px;
            margin: 0 auto 20px auto;
            padding: 0 4px;
        }
        .detalle-header h2 {
            color: #1a1a1a;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        @media (max-width: 600px) {
            .detalle-wrapper { padding: 24px; border-radius: 16px; }
            .fila-superior { flex-direction: column; align-items: flex-start; gap: 20px; }
            .mitad-imagen { width: 150px; height: 150px; flex: 0 0 150px; }
            .detalle-datos { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <main>

        <!-- ================= VISTA CATÁLOGO ================= -->
        <section id="vista-catalogo">

            <!-- BARRA DE NAVEGACIÓN (SOLO VISIBLE EN EL CATÁLOGO) -->
            <nav>
                <h1>COFFE PWA</h1>
                <ul class="menu">
                    <li>Home</li>
                    <li>Acerca de</li>
                    <li>Blog</li>
                </ul>
            </nav>

            <section id="contenedor-cafes" class="conteiner">
                <!-- JavaScript insertará las cards aquí -->
            </section>

        </section>

        <!-- ================= VISTA DETALLE ================= -->
        <section id="vista-detalle">

            <!-- Encabezado pequeño de la vista detalle -->
            <div class="detalle-header">
                <h2>☕ Detalle del producto</h2>
            </div>

            <div class="detalle-wrapper">
                <div class="fila-superior">
                    <div class="mitad-imagen">
                        <img id="detalle-img" src="" alt="Café">
                    </div>
                    <div class="mitad-descripcion">
                        <h1 id="detalle-nombre">Cargando...</h1>
                        <p class="detalle-precio" id="detalle-precio"></p>
                        <p class="detalle-desc" id="detalle-desc"></p>
                    </div>
                </div>

                <div class="seccion">
                    <h2 class="seccion-titulo">Descripción detallada</h2>
                    <p class="seccion-texto" id="detalle-desclarga"></p>
                </div>

                <div class="seccion">
                    <h2 class="seccion-titulo">Información del producto</h2>
                    <ul class="detalle-datos">
                        <li><span>Tamaño</span><span id="detalle-tamanio"></span></li>
                        <li><span>Origen</span><span id="detalle-origen"></span></li>
                        <li><span>Intensidad</span><span id="detalle-intensidad"></span></li>
                        <li><span>Cafeína</span><span id="detalle-cafeina"></span></li>
                    </ul>
                </div>

                <div class="seccion">
                    <h2 class="seccion-titulo">Ingredientes</h2>
                    <ul class="lista-ingredientes" id="detalle-ingredientes"></ul>
                </div>

                <button id="btn-volver" class="btn-volver">← Volver al inicio</button>
            </div>

        </section>

    </main>

    <script src="js/app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./serviceworker.js')
                .then(() => console.log('Service Worker registrado'))
                .catch(error => console.log('Error SW:', error));
        });
    }
    </script>

</body>
</html>
