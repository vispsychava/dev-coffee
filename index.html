<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Iconos Apple -->
    <link rel="apple-touch-icon" href="imagenes/icons/icon-72x72.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-96x96.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-128x128.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-144x144.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-152x152.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-384x384.png">
    <link rel="apple-touch-icon" href="imagenes/icons/icon-512x512.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Coffe PWA</title>
</head>

<body>

    <main>
        <!-- BARRA DE NAVEGACIÓN -->
        <nav>
            <h1>COFFE PWA</h1>
            <ul class="menu">
                <li>Home</li>
                <li>Acerca de</li>
                <li>Blog</li>
            </ul>
        </nav>

        <!-- CONTENEDOR DE LAS TARJETAS -->
        <section id="contenedor-cafes" class="conteiner">
            <!-- JavaScript insertará las cards aquí -->
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./serviceworker.js')
                .then(registro => {
                    console.log('Service Worker registrado correctamente');
                })
                .catch(error => {
                    console.log('Error al registrar el Service Worker:', error);
                });
        });
    }
    </script>

</body>
</html>
